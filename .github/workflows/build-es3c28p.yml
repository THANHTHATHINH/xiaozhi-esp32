name: Build ES3C28P firmware

# Builds only the LCDWiki ES3C28P board and publishes merged-binary.bin as a downloadable artifact.
# Runs automatically when the es3c28p-build branch is pushed, or manually via "Run workflow".
on:
  push:
    branches:
      - es3c28p-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          source "$IDF_PATH/export.sh"
          python scripts/build.py lcdwiki-es3c28p --name lcdwiki-es3c28p

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: es3c28p-merged-binary
          path: build/merged-binary.bin
